# Fly.io deployment config for the Trail Names directory.
# Deploy with: fly launch (or fly deploy, once the app exists)

app = "trailnames-club"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE = "/data/trailnames.db"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# Persistent volume for the SQLite database (survives deploys & restarts).
# Create once with: fly volumes create trail_data --size 1 --region iad
[[mounts]]
  source = "trail_data"
  destination = "/data"
