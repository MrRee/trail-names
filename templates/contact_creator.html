{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block content %}
<section class="pagehead">
<h1>Contact the creator</h1>
<p class="lede">Questions, corrections, or just want to say hi — this goes straight to me.</p>
</section>

<form method="post" class="formcard">
  <label>Your name *
    <input type="text" name="sender_name" required maxlength="80">
  </label>
  <label>Your email *
    <input type="email" name="sender_email" required>
  </label>
  <label>Message *
    <textarea name="body" rows="6" required maxlength="2000"
      placeholder="Hi Mateo, ..."></textarea>
  </label>
  <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off">
  <button type="submit">Send message</button>
</form>
{% endblock %}
